<!DOCTYPE html>
<html>
<head>
  <title>example search at DuckDuckGo</title>
  <style>.result { color: red; }</style>
</head>
<body>
  <div id="links" class="results">
    <div class="result results_links results_links_deep web-result">
      <div class="result__body">
        <h2 class="result__title">
          <a rel="nofollow" class="result__a"
             href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fexample.com%2Fdocs%2F&amp;rut=6f1c2a">Example &amp; Docs</a>
        </h2>
        <a class="result__snippet" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fexample.com%2Fdocs%2F">
          Learn <b>things</b> &quot;fast&quot; &amp; safely&#x27;s.
        </a>
      </div>
    </div>

    <div class="result result--ad result--ad--small">
      <div class="result__body">
        <h2 class="result__title">
          <a class="result__a" href="https://duckduckgo.com/y.js?ad_provider=bing&amp;u3=https%3A%2F%2Fads.example">Buy stuff now</a>
        </h2>
        <a class="result__snippet" href="https://duckduckgo.com/y.js?ad_provider=bing">Sponsored &amp; irrelevant.</a>
      </div>
    </div>

    <div class="result results_links">
      <div class="result__body">
        <h2 class="result__title">
          <a class="result__a" href="https://www.example.com/docs/">Example docs (www duplicate)</a>
        </h2>
        <div class="result__snippet">Same page, different URL.</div>
      </div>
    </div>

    <div class="web-result">
      <div class="result__body">
        <h2 class="result__title">
          <a class="result__a" href="https://bun.sh/docs">Bun documentation</a>
        </h2>
        <div class="result__snippet">Fast JavaScript runtime.</div>
      </div>
    </div>

    <div class="result">
      <a class="result__a" href="https://duckduckgo.com/settings">DuckDuckGo settings</a>
      <div class="result__snippet">Internal link, no uddg.</div>
    </div>
  </div>
</body>
</html>
